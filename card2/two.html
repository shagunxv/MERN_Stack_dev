<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="two.css">
    <title>Second Card</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <img src="net.jpg" alt="">
            <div class="textbox">
                <h2>Order Summary</h2>
                <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Repellat ex accusamus quam suscipit ipsam! Harum velit mollitia repellat labore earum?</p>
            </div>
            <div id="amountbox">
                <div class="left">
                    <div class="imagebox">
                        <img src="music.jpg" alt="">
                    </div>
                    <div class="textamount">
                        <p>Amount</p>
                        <p>$99.9/year</p>
                    </div>
                </div>
                <div class="right">
                    <a href="">Change</a>
                </div>
            </div>
           <button id = "paymentbtn">Proceed to Payment  </button>
           <div class="cancelbox">
            <a href="#">Cancel Order</a>
           </div>

        </div>

    </div>
</body>
</html>
